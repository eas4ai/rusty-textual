[workspace]
members = [
  "app",
  "coldapp_kanban",
  "coldapp_pomodoro",
  "coldapp_form",
  "coldapp_stream",
  "events",
  "getting_started",
  "guide/actions",
  "guide/animator",
  "guide/command_palette",
  "guide/compound",
  "guide/content",
  "guide/core",
  "guide/css",
  "guide/input",
  "guide/layout",
  "guide/reactivity",
  "guide/screens",
  "guide/styles",
  "guide/testing",
  "guide/widgets",
  "guide/workers",
  "how-to",
  "styles",
  "themes",
  "tutorial",
  "widgets",
]
resolver = "2"

# Strict clippy: pedantic at warn level, so plain `cargo clippy --all-targets`
# is strict. Never deny warnings (`-D warnings`); clear them instead.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
